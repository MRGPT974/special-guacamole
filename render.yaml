services:
  - type: web
    name: tatienounou-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: tatienounou-db
          property: host
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        fromDatabase:
          name: tatienounou-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tatienounou-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: tatienounou-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: tatienounou-db
    databaseName: tatienounou
    user: root

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription Pro - Tatienounou</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <main class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="bg-white shadow-xl rounded-xl p-8 max-w-2xl w-full">
      <h1 class="text-2xl font-bold text-center text-violet-700 mb-6">Créer un compte professionnel</h1>

      <form class="space-y-6">

        <div>
          <label class="block text-sm font-medium mb-1">Nom complet du responsable</label>
          <input type="text" class="w-full border rounded px-4 py-2" placeholder="Nom et prénom" required />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Adresse email</label>
          <input type="email" class="w-full border rounded px-4 py-2" placeholder="pro@example.com" required />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Nom de l’établissement / structure</label>
          <input type="text" class="w-full border rounded px-4 py-2" placeholder="Ex : MAM Les Petits Koalas" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Type de professionnel</label>
          <select class="w-full border rounded px-4 py-2" required>
            <option value="">Choisir</option>
            <option value="assmat">Assistante Maternelle Agréée</option>
            <option value="mam">MAM / Micro-crèche</option>
            <option value="creche">Crèche</option>
            <option value="collectivite">Collectivité</option>
          </select>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Nombre d’enfants maximum</label>
            <input type="number" min="1" class="w-full border rounded px-4 py-2" required />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Téléphone</label>
            <input type="tel" class="w-full border rounded px-4 py-2" placeholder="06..." />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Disponibilités</label>
          <input type="text" class="w-full border rounded px-4 py-2" placeholder="Ex : Lundi à Vendredi - 7h à 18h" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Document justificatif (PDF ou image)</label>
          <input type="file" class="w-full border rounded px-4 py-2 bg-white" accept=".pdf,image/*" />
        </div>

        <button type="submit" class="w-full bg-violet-600 text-white py-3 rounded hover:bg-violet-700 transition">
          Valider l'inscription
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="index.html" class="text-sm text-gray-500 hover:text-violet-600 underline">← Retour à l'accueil</a>
      </div>
    </div>
  </main>

  <footer class="bg-gray-100 text-sm text-center py-8 mt-10">
    <div class="flex justify-center gap-6 flex-wrap text-gray-600 mb-4">
      <a href="footer/mentions-legales.html" class="hover:underline">Mentions légales</a>
      <a href="footer/confidentialite.html" class="hover:underline">Politique de confidentialité</a>
      <a href="footer/cookies.html" class="hover:underline">Cookies</a>
      <a href="footer/cgv.html" class="hover:underline">CGV</a>
      <a href="footer/cgu.html" class="hover:underline">CGU</a>
    </div>
    <p class="text-gray-500">&copy; 2025 Tatienounou.fr – Tous droits réservés.</p>
  </footer>

</body>
</html>

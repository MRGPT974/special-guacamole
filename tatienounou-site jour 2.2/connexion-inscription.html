<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Tatienounou</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <main class="min-h-screen flex items-center justify-center px-4 py-12 bg-gray-50 relative">

    <!-- Image de fond -->
    <div class="absolute inset-0 z-0">
      <img src="https://images.unsplash.com/photo-1589820296156-2454bb8b2f2d?fit=crop&w=1600&q=80"
           alt="Enfant heureux" class="w-full h-full object-cover opacity-20" />
    </div>

    <!-- Bloc connexion -->
    <div class="relative z-10 bg-white shadow-xl rounded-xl p-8 max-w-md w-full">
      <h1 class="text-2xl font-bold text-center text-violet-700 mb-6">Connexion</h1>

      <form class="space-y-4">
        <select class="w-full border rounded px-4 py-2" required>
          <option value="">Je suis...</option>
          <option value="parent">👨‍👩‍👧 Parent</option>
          <option value="pro">👩‍🏫 Professionnel</option>
        </select>

        <input type="email" placeholder="Email" class="w-full border rounded px-4 py-2" required />
        <input type="password" placeholder="Mot de passe" class="w-full border rounded px-4 py-2" required />

        <button type="submit" class="w-full bg-violet-600 text-white py-2 rounded hover:bg-violet-700 transition">
          Se connecter
        </button>
      </form>

      <div class="my-6 text-center text-sm text-gray-500">ou se connecter avec</div>

      <div class="space-y-3">
        <button class="w-full border py-2 rounded flex items-center justify-center hover:bg-gray-100">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5 mr-2" />
          Google
        </button>
        <button class="w-full border py-2 rounded flex items-center justify-center hover:bg-gray-100">
          📱 Se connecter avec son téléphone
        </button>
      </div>

      <p class="text-center text-sm text-gray-500 mt-6">Pas encore inscrit ?</p>
      <div class="flex justify-center gap-4 mt-2">
        <a href="register-parent.html" class="text-violet-600 hover:underline text-sm font-semibold">Créer un compte parent</a>
        <a href="register-pro.html" class="text-violet-600 hover:underline text-sm font-semibold">Créer un compte pro</a>
      </div>

      <!-- Retour -->
      <div class="mt-8 text-center">
        <a href="index.html" class="text-violet-600 hover:underline text-sm font-semibold">
          ← Retour à l'accueil
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-100 text-sm text-center py-8 mt-10">
    <div class="flex justify-center gap-6 flex-wrap text-gray-600 mb-4">
      <a href="footer/mentions-legales.html" class="hover:underline">Mentions légales</a>
      <a href="footer/confidentialite.html" class="hover:underline">Politique de confidentialité</a>
      <a href="footer/cookies.html" class="hover:underline">Cookies</a>
      <a href="footer/cgv.html" class="hover:underline">CGV</a>
      <a href="footer/cgu.html" class="hover:underline">CGU</a>
    </div>
    <p class="text-gray-500">&copy; 2025 Tatienounou.fr – Tous droits réservés.</p>
  </footer>

</body>
</html>

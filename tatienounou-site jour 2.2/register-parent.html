<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription Parent - Tatienounou</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <header class="bg-violet-600 text-white text-center py-6 shadow">
    <h1 class="text-2xl font-semibold">Inscription - Parent</h1>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-12 bg-white shadow-lg rounded-xl my-8">
    <form class="space-y-6">
      <h2 class="text-xl font-semibold text-violet-700 mb-4">Vos informations</h2>

      <div class="grid md:grid-cols-2 gap-4">
        <input type="text" placeholder="Nom" class="w-full border px-4 py-2 rounded" required />
        <input type="text" placeholder="Prénom" class="w-full border px-4 py-2 rounded" required />
      </div>

      <input type="email" placeholder="Adresse email" class="w-full border px-4 py-2 rounded" required />
      <input type="text" placeholder="Adresse postale" class="w-full border px-4 py-2 rounded" required />
      <input type="tel" placeholder="Téléphone" class="w-full border px-4 py-2 rounded" required />

      <h3 class="text-lg font-semibold mt-8 text-gray-700">Informations sur les enfants</h3>

      <div id="enfants" class="space-y-4">
        <div class="grid md:grid-cols-3 gap-4">
          <input type="text" placeholder="Prénom enfant" class="w-full border px-3 py-2 rounded" required />
          <input type="number" placeholder="Âge" class="w-full border px-3 py-2 rounded" required />
          <input type="text" placeholder="Besoin spécifique" class="w-full border px-3 py-2 rounded" />
        </div>
      </div>

      <button type="button" onclick="ajouterEnfant()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">+ Ajouter un enfant</button>

      <button type="submit" class="w-full bg-violet-600 text-white py-3 rounded hover:bg-violet-700 transition mt-6">Valider l'inscription</button>
    </form>

    <div class="mt-8 text-center">
      <a href="index.html" class="text-sm text-gray-500 hover:text-violet-600 underline">← Retour à l'accueil</a>
    </div>
  </main>

  <footer class="bg-gray-100 text-sm text-center py-8 mt-10">
    <div class="flex justify-center gap-6 flex-wrap text-gray-600 mb-4">
      <a href="footer/mentions-legales.html" class="hover:underline">Mentions légales</a>
      <a href="footer/confidentialite.html" class="hover:underline">Politique de confidentialité</a>
      <a href="footer/cookies.html" class="hover:underline">Cookies</a>
      <a href="footer/cgv.html" class="hover:underline">CGV</a>
      <a href="footer/cgu.html" class="hover:underline">CGU</a>
    </div>
    <p class="text-gray-500">&copy; 2025 Tatienounou.fr – Tous droits réservés.</p>
  </footer>

  <script>
    function ajouterEnfant() {
      const div = document.createElement("div");
      div.className = "grid md:grid-cols-3 gap-4 mt-2";
      div.innerHTML = `
        <input type="text" placeholder="Prénom enfant" class="w-full border px-3 py-2 rounded" required />
        <input type="number" placeholder="Âge" class="w-full border px-3 py-2 rounded" required />
        <input type="text" placeholder="Besoin spécifique" class="w-full border px-3 py-2 rounded" />
      `;
      document.getElementById("enfants").appendChild(div);
    }
  </script>

</body>
</html>
